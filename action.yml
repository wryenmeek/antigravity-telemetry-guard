name: 'Antigravity Telemetry Pre-Merge Guard'
description: 'Validates that 100% of Antigravity agent sessions in a pull request have verified token telemetry receipts'
author: 'wryenmeek'

inputs:
  pr-number:
    description: 'Pull Request number to verify'
    required: true
  post-status:
    description: 'Post GitHub Commit Status check to headRefOid upon completion'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token with contents:read, pull-requests:read, statuses:write'
    required: false
    default: ${{ github.token }}
  repo:
    description: 'Optional owner/repo if checking across repositories'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install antigravity-telemetry
      shell: bash
      run: |
        python3 -m pip install "${{ github.action_path }}"

    - name: Execute Antigravity Telemetry Guard
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: |
        ARGS="--pr ${{ inputs.pr-number }}"
        if [ -n "${{ inputs.repo }}" ]; then
          ARGS="$ARGS --repo ${{ inputs.repo }}"
        fi
        if [ "${{ inputs.post-status }}" = "true" ]; then
          ARGS="$ARGS --post-status"
        fi
        antigravity-telemetry verify $ARGS
